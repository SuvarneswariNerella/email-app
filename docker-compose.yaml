version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - IMAP_HOST=${IMAP_HOST:-mail.yourcompany.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_SECURE=${IMAP_SECURE:-true}
      - SMTP_HOST=${SMTP_HOST:-mail.yourcompany.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - JWT_SECRET=${JWT_SECRET:-corporate_secure_webmail_jwt_secret_key}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
